<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XAUUSD Login</title><style>body{font:16px system-ui;background:#101827;color:#eef3ff;min-height:100vh;display:grid;place-items:center;margin:0}main{background:#1b2940;border:1px solid #34435c;border-radius:14px;padding:30px;width:min(350px,85vw)}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;border-radius:8px;font:inherit}input{background:#101827;color:white;border:1px solid #54657b}button{background:#317db2;color:white;border:0;cursor:pointer}#error{color:#ff9b9b;min-height:1.5em}</style><main><h2>XAUUSD Analysis</h2><p>Masuk menggunakan akun EMA atau BBMA.</p><form id="login"><input id="user" autocomplete="username" placeholder="Username" required><input id="pass" type="password" autocomplete="current-password" placeholder="Password" required><button>Masuk</button><p id="error" role="alert"></p></form></main><script>document.getElementById('login').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('error');msg.textContent='Memeriksa...';try{const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('user').value,password:document.getElementById('pass').value})});if(!r.ok){msg.textContent=r.status===401?'Username atau password salah':'Login belum tersedia. Periksa konfigurasi Railway.';return}location.replace('/')}catch{msg.textContent='Tidak dapat terhubung ke server.'}}</script></html>
