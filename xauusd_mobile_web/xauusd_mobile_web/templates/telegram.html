
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegram Settings — XAUUSD</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0b1120; color: #e5e7eb;
      font-family: Arial, sans-serif;
    }
    .layout { display: flex; min-height: 100vh; }
    aside {
      width: 230px; padding: 24px 16px;
      background: #111827; border-right: 1px solid #334155;
    }
    aside h2 { font-size: 18px; margin: 0 0 28px; }
    aside a {
      display: block; padding: 12px; margin-bottom: 8px;
      color: #cbd5e1; text-decoration: none; border-radius: 8px;
    }
    aside a.active, aside a:hover { background: #1e293b; color: white; }
    main { flex: 1; padding: 32px; max-width: 1050px; }
    h1 { margin-top: 0; }
    .muted { color: #94a3b8; line-height: 1.6; }
    .card {
      background: #111827; border: 1px solid #334155;
      border-radius: 14px; padding: 24px; margin: 22px 0;
    }
    .card-header {
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
    }
    .card h2 { margin: 0; font-size: 20px; }
    .options {
      display: flex; flex-wrap: wrap; gap: 12px;
      margin-top: 16px;
    }
    label.option {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 14px; background: #1e293b;
      border-radius: 8px; cursor: pointer;
    }
    input { accent-color: #38bdf8; width: 17px; height: 17px; }
    h3 { margin: 22px 0 8px; font-size: 15px; }
    button {
      padding: 13px 24px; border: 0; border-radius: 8px;
      background: #0284c7; color: white; font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }
    #status { margin-top: 16px; min-height: 22px; }
    @media(max-width: 650px) {
      .layout { display: block; }
      aside { width: 100%; padding: 12px; }
      aside h2 { margin-bottom: 12px; }
      main { padding: 18px; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
<div class="layout">
  <aside>
    <h2>XAUUSD Analysis</h2>
    <a href="/">📈 EMA Analysis</a>
    <a href="/bbma">📊 BBMA Scanner</a>
    <a href="/zzl">⚡ ZZL Scanner</a>
    <a href="/telegram" class="active">🔔 Telegram Settings</a>
  </aside>

  <main>
    <h1>🔔 Telegram Settings</h1>
    <p class="muted">
      Pilih scanner, timeframe, dan kondisi yang ingin dikirim
      otomatis ke Telegram ketika candle baru selesai.
    </p>

    <div id="settings"></div>

    <button id="saveBtn" onclick="saveSettings()">
      Save Settings
    </button>
    <div id="status" role="status"></div>
  </main>
</div>

<script>
const FRAMES = ["M1", "M5", "M15", "H1", "H4", "D1", "W1"];
const BBMA_FRAMES = ["M5", "M15", "H1", "H4", "D1", "W1"];
const CONDITIONS = ["EXTREME", "MHV", "CSAK", "CSM", "REENTRY"];

const SCANNERS = [
  { key: "ema", title: "EMA Analysis", frames: FRAMES },
  { key: "bbma", title: "BBMA Scanner", frames: BBMA_FRAMES },
  { key: "zzl", title: "ZZL Scanner", frames: FRAMES }
];

function checkbox(name, value, checked) {
  const label = document.createElement("label");
  label.className = "option";

  const input = document.createElement("input");
  input.type = "checkbox";
  input.dataset.name = name;
  input.value = value;
  input.checked = checked;

  label.append(input, document.createTextNode(value));
  return label;
}

function render(settings) {
  const root = document.getElementById("settings");
  root.replaceChildren();

  for (const scanner of SCANNERS) {
    const data = settings[scanner.key];
    const card = document.createElement("section");
    card.className = "card";

    const header = document.createElement("div");
    header.className = "card-header";

    const title = document.createElement("h2");
    title.textContent = scanner.title;

    const toggle = checkbox(
      scanner.key + ".enabled",
      "Enable",
      data.enabled
    );

    header.append(title, toggle);
    card.append(header);

    const heading = document.createElement("h3");
    heading.textContent = "Timeframes";
    card.append(heading);

    const frames = document.createElement("div");
    frames.className = "options";

    for (const tf of scanner.frames) {
      frames.append(
        checkbox(
          scanner.key + ".timeframes",
          tf,
          data.timeframes.includes(tf)
        )
      );
    }

    card.append(frames);

    if (scanner.key === "bbma") {
      const conditionTitle = document.createElement("h3");
      conditionTitle.textContent = "BBMA Conditions";
      card.append(conditionTitle);

      const conditions = document.createElement("div");
      conditions.className = "options";

      for (const condition of CONDITIONS) {
        conditions.append(
          checkbox(
            "bbma.conditions",
            condition,
            data.conditions.includes(condition)
          )
        );
      }

      card.append(conditions);
    }

    root.append(card);
  }
}

function selected(name) {
  return [...document.querySelectorAll("input")]
    .filter(input => input.dataset.name === name && input.checked)
    .map(input => input.value);
}

function collect() {
  const config = {};

  for (const scanner of SCANNERS) {
    config[scanner.key] = {
      enabled: selected(scanner.key + ".enabled").length > 0,
      timeframes: selected(scanner.key + ".timeframes")
    };
  }

  config.bbma.conditions = selected("bbma.conditions");
  return config;
}

async function loadSettings() {
  const status = document.getElementById("status");

  try {
    const response = await fetch("/api/telegram/settings");

    if (response.status === 401) {
      location.href = "/login";
      return;
    }

    if (!response.ok) throw new Error("Gagal mengambil pengaturan");

    render(await response.json());
  } catch (error) {
    status.textContent = error.message;
  }
}

async function saveSettings() {
  const button = document.getElementById("saveBtn");
  const status = document.getElementById("status");

  button.disabled = true;
  status.textContent = "Menyimpan...";

  try {
    const response = await fetch("/api/telegram/settings", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(collect())
    });

    if (response.status === 401) {
      location.href = "/login";
      return;
    }

    if (!response.ok) {
      throw new Error("Gagal menyimpan pengaturan");
    }

    status.textContent = "✓ Pengaturan berhasil disimpan.";
  } catch (error) {
    status.textContent = error.message;
  } finally {
    button.disabled = false;
  }
}

loadSettings();
</script>
</body>
</html>
